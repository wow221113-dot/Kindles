function mkPC(pid,init,n=0){const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});const E=V.pcs[pid]={pc,q:[]};
 V.stream.getTracks().forEach(t=>pc.addTrack(t,V.stream));
 pc.onicecandidate=e=>{if(e.candidate)V.room.emit('sig',{to:pid,k:'ice',c:e.candidate.toJSON()}).catch(()=>{})};
 pc.ontrack=e=>{let a=V.aud[pid];if(!a)a=V.aud[pid]=new Audio();a.srcObject=e.streams[0];a.muted=V.deaf;a.play().catch(()=>{});watch(e.streams[0],uidOf(pid))};
 if(init){pc.createOffer().then(o=>pc.setLocalDescription(o)).then(()=>V.room.emit('sig',{to:pid,k:'o',s:pc.localDescription.sdp})).catch(x=>toast('Voice signalling failed: '+(x.message||x)));
  setTimeout(()=>{const ok=['connected','completed'].includes(pc.iceConnectionState);if(V&&V.pcs[pid]===E&&!ok){closePC(pid);if(n<3)mkPC(pid,true,n+1);else toast('Couldn’t connect voice to '+(P(uidOf(pid)).un||'a friend')+'. A strict network may be blocking it.')}},6000)}return E}
async function onSig(m){const d=m.data;if(!V||!d||d.to!==V.me)return;const pid=m.peer;let E=V.pcs[pid];
 try{if(d.k==='o'){if(E)closePC(pid);E=mkPC(pid,false);await E.pc.setRemoteDescription({type:'offer',sdp:d.s});for(const c of E.q)await E.pc.addIceCandidate(c);E.q=[];const a=await E.pc.createAnswer();await E.pc.setLocalDescription(a);V.room.emit('sig',{to:pid,k:'a',s:E.pc.localDescription.sdp})}
 else if(d.k==='a'&&E){await E.pc.setRemoteDescription({type:'answer',sdp:d.s});for(const c of E.q)await E.pc.addIceCandidate(c);E.q=[]}
 else if(d.k==='ice'&&E){E.pc.remoteDescription?await E.pc.addIceCandidate(d.c):E.q.push(d.c)}}catch(x){console.warn('sig',x)}}
function closePC(pid){const E=V&&V.pcs[pid];if(E){E.pc.close();delete V.pcs[pid]}if(V&&V.aud[pid]){V.aud[pid].srcObject=null;delete V.aud[pid]}}
async function joinVoice(c){if(!ROOM)return toast('Live voice isn’t available in this view.');if(V)await leaveVoice();
 if(!window.RTCPeerConnection||!navigator.mediaDevices)return toast('This browser can’t do voice chat.');
 let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}catch(e){return toast('Microphone blocked. Allow mic access (or open the page in its own tab) and try again.')}
 let room;try{room=await ROOM.join('v-'+c.id)}catch(e){stream.getTracks().forEach(t=>t.stop());return toast('Couldn’t open voice room: '+(e.message||e))}
 V={cid:c.id,room,stream,pcs:{},aud:{},sp:{},cl:[],offs:[],me:null,muted:joinMuted,deaf:false};stream.getAudioTracks().forEach(t=>t.enabled=!joinMuted);
 watch(stream,ME.uid);await room.presence({uid:ME.uid});
 V.offs.push(room.on('sig',onSig),room.onPeers(ch=>{const me=ch.peers.find(p=>p.isMe);if(me)V.me=me.peer;if(!V.me)return;
  ch.peers.forEach(p=>{if(!p.isMe&&V.me<p.peer&&!V.pcs[p.peer])mkPC(p.peer,true)});ch.left.forEach(p=>closePC(p.peer))}));
 const ref=db.doc('voice/'+c.id+'__'+ME.uid),beat=()=>ref.set({cid:c.id,uid:ME.uid,t:Date.now()}).catch(()=>{});beat();const hb=setInterval(beat,20000);V.cl.push(()=>clearInterval(hb));
 $('#vbar').classList.add('show');$('#vn').textContent='· '+c.n;$('#vmute').textContent=V.muted?'🔇':'🎙️';stage()}
async function leaveVoice(){if(!V)return;const v=V;V=null;v.offs.forEach(f=>f&&f());v.cl.forEach(f=>f());Object.keys(v.pcs).forEach(p=>v.pcs[p].pc.close());Object.values(v.aud).forEach(a=>a.srcObject=null);v.stream.getTracks().forEach(t=>t.stop());
 try{await v.room.leave();await db.doc('voice/'+v.cid+'__'+ME.uid).delete()}catch(e){}$('#vbar').classList.remove('show');stage()}
function togMute(){if(!V)return;V.muted=!V.muted;V.stream.getAudioTracks().forEach(t=>t.enabled=!V.muted);$('#vmute').textContent=V.muted?'🔇':'🎙️';stage()}
$('#vmute').onclick=togMute;$('#vleave').onclick=leaveVoice;
$('#vdeaf').onclick=()=>{if(!V)return;V.deaf=!V.deaf;Object.values(V.aud).forEach(a=>a.muted=V.deaf);$('#vdeaf').textContent=V.deaf?'🔕':'🎧'};
addEventListener('beforeunload',()=>{if(V)try{db.doc('voice/'+V.cid+'__'+ME.uid).delete()}catch(e){}});

 el.onclick=end;setTimeout(end,rm?900:3600)})();
